<!DOCTYPE html>
<html>
<head>
    <title>Smart Notice Board Pro</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <h2>📌 Notice Board </h2>
    <div class="menu">
        <div onclick="filter('All')">🏠 All</div>
        <div onclick="filter('Exam')">📘 Exam</div>
        <div onclick="filter('Event')">🎉 Event</div>
        <div onclick="filter('Holiday')">🏖 Holiday</div>
    </div>
</div>

<!-- MAIN -->
<div class="main">
    <div class="header">
        <input type="text" id="search" placeholder="Search..." onkeyup="searchNotice()">
        <button class="btn" onclick="openModal()">+ Add</button>
    </div>

    <div class="grid" id="board"></div>
</div>

<!-- MODAL -->
<div class="modal" id="modal" onclick="closeModal(event)">
    <div class="modal-box" onclick="event.stopPropagation()">
        <h3>Add Notice</h3>
        <input type="text" id="title" placeholder="Title"><br>
        
        <select id="category">
            <option>Exam</option>
            <option>Event</option>
            <option>Holiday</option>
        </select>

        <textarea id="desc" placeholder="Description"></textarea>
        <button class="btn" onclick="addNotice()">Post</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
