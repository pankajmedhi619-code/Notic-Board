<!DOCTYPE html>
<html>
<head>
    <title>Memory Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>🧠 Memory Card Game</h1>

    <div class="top-bar glass">
        <span>⏱ <b id="time">0</b>s</span>
        <span>🔢 <b id="moves">0</b></span>
        <button onclick="restartGame()">Restart</button>
        <button onclick="toggleMode()">🌙/☀️</button>
    </div>

    <div class="players glass">
        <div>👤 P1: <span id="p1">0</span></div>
        <div>👤 P2: <span id="p2">0</span></div>
        <p id="turn">Turn: Player 1</p>
    </div>

    <div class="best glass">
        🏆 Best Score: <span id="best">-</span>
    </div>

    <div class="game glass" id="game"></div>

</div>

<div id="popup" class="popup glass">
    <h2>🎉 Game Over!</h2>
    <p id="result"></p>
    <button onclick="restartGame()">Play Again</button>
</div>

<script src="script.js"></script>

</body>
</html>
